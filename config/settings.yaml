model:
  path: models/qwen2.5-3b-instruct-q4_k_m.gguf   # jetson_setup.sh swaps in the 7B/8B if it fits
  n_ctx: 4096
  n_gpu_layers: -1          # all layers on GPU on the Jetson; ignored on CPU
  n_threads: 6
  candidates: 3
  max_tokens: 24
  temperature: 0.2

whisper:
  model: small.en           # models/ggml-small.en.bin; try medium.en if his voice needs it
  chunk_seconds: 1.0
  language: en
  capture_device: null      # null = default mic; `whisper-stream -c -1` lists devices

ring:
  seconds: 60
  tail_seconds: 6           # the speaker's "last few seconds" sent as the stall

tts:
  voice: en_US-lessac-medium
  gap_ms: 350               # pause between the three words

button:
  device_name: Nudge        # substring of the evdev device name (firmware reports "XIAO Nudge Button")
  double_click_ms: 400      # handled in the XIAO firmware

ui:
  port: 8765

log:
  enabled: false
  path: logs/stalls.csv
