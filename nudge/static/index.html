<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nudge</title>
<style>
  /* 5" 800x480 panel, held at arm's length, read in a glance. One job. */
  :root {
    --bg: #0e0f12;
    --card: #1a1c22;
    --card-hi: #262a33;
    --ink: #f4f1ea;
    --dim: #8a8f99;
    --accent: #ffb13d;
    --ok: #5fd18b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Ubuntu", "DejaVu Sans", system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { display: grid; grid-template-rows: 1fr 56px; }

  main { display: grid; grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 12px 12px 0; }
  .card {
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border-radius: 18px;
    font-size: 64px; font-weight: 600; letter-spacing: -0.01em; line-height: 1;
    text-transform: lowercase; transition: background .08s;
  }
  .card:active { background: var(--card-hi); }
  .card.first { color: var(--accent); }
  .card.empty { color: var(--dim); font-size: 28px; font-weight: 400; }
  .card.long { font-size: 44px; }

  footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
  .dot.listening { background: var(--ok); }
  .dot.thinking { background: var(--accent); animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }
  .more {
    justify-self: center; padding: 10px 28px; border-radius: 999px;
    background: var(--card); color: var(--ink); border: 0;
    font: inherit; font-size: 22px; font-weight: 600;
  }
  .more:active { background: var(--card-hi); }
  .more[disabled] { opacity: .35; }
  .batt { justify-self: end; color: var(--dim); font-size: 18px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <main id="cards">
    <div class="card empty" data-i="0">press the button when you're stuck</div>
    <div class="card empty" data-i="1"></div>
    <div class="card empty" data-i="2"></div>
  </main>
  <footer>
    <div class="status"><span class="dot" id="dot"></span><span id="status">starting</span></div>
    <button class="more" id="more" disabled>more</button>
    <div class="batt" id="batt"></div>
  </footer>

<script>
(() => {
  const cards = [...document.querySelectorAll('.card')];
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const more = document.getElementById('more');
  const post = (path, body) => fetch(path, {method: 'POST', body: body ? JSON.stringify(body) : null});

  const LABEL = {starting: 'starting up', listening: 'listening', thinking: 'thinking'};

  function showWords(words, moreCount) {
    cards.forEach((c, i) => {
      const w = words[i];
      c.textContent = w || '';
      c.className = 'card' + (w ? (i === 0 ? ' first' : '') + (w.length > 10 ? ' long' : '') : ' empty');
    });
    if (!words.length) { cards[0].textContent = 'say a little more, then press again'; cards[0].className = 'card empty'; }
    more.disabled = !words.length;
    more.textContent = moreCount ? `more (${moreCount + 1})` : 'more';
  }

  function setStatus(s) {
    dot.className = 'dot ' + s;
    status.textContent = LABEL[s] || s;
  }

  cards.forEach(c => c.addEventListener('click', () => {
    if (c.classList.contains('empty')) return;
    post('/tap', {index: +c.dataset.i});
  }));
  more.addEventListener('click', () => post('/more'));

  // long-press anywhere on the cards area = repeat
  let t;
  document.getElementById('cards').addEventListener('pointerdown', () => { t = setTimeout(() => post('/repeat'), 700); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
    document.getElementById('cards').addEventListener(ev, () => clearTimeout(t)));

  function connect() {
    const es = new EventSource('/events');
    es.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'state') { setStatus(m.status); if (m.words && m.words.length) showWords(m.words, m.more); }
      if (m.type === 'words') showWords(m.words, m.more);
      if (m.type === 'status') setStatus(m.status);
    };
    es.onerror = () => { es.close(); setStatus('starting'); setTimeout(connect, 1500); };
  }
  connect();

  // battery, when the kiosk browser exposes it (it does on Chromium with upower)
  if (navigator.getBattery) navigator.getBattery().then(b => {
    const show = () => document.getElementById('batt').textContent = Math.round(b.level * 100) + '%';
    show(); b.addEventListener('levelchange', show);
  });
})();
</script>
</body>
</html>
